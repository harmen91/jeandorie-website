services:
  php-site:
    image: php:apache
    container_name: php-site
    restart: unless-stopped
    volumes:
      # Mounts the local site/ folder into Apache's web root
      - ./site:/var/www/html
    # CHANGE THIS PORT NR. PLX EVERY TIME THANK YOU 
    # Pick any free port — NPM will proxy to it
    ports:
      - "YOUR_PORT:6942"